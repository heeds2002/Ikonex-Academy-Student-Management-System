<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Ikonex Academy SMS</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard">
<div class="layout">
<nav class="sidebar">
  <div class="sidebar-logo"><div class="logo-mark"><div class="logo-icon"><i class="ti ti-school"></i></div><div><div class="logo-text">Ikonex Academy</div><div class="logo-sub">School Management</div></div></div></div>
  <div class="nav"><div class="nav-section"><div class="nav-label">Overview</div><a class="nav-item" data-page="dashboard" href="index.html"><i class="ti ti-layout-dashboard"></i>Dashboard</a></div><div class="nav-section"><div class="nav-label">Academic</div><a class="nav-item" data-page="streams" href="pages/streams.html"><i class="ti ti-layers-subtract"></i>Class Streams</a><a class="nav-item" data-page="subjects" href="pages/subjects.html"><i class="ti ti-book"></i>Subjects</a><a class="nav-item" data-page="students" href="pages/students.html"><i class="ti ti-users"></i>Students</a></div><div class="nav-section"><div class="nav-label">Assessment</div><a class="nav-item" data-page="scores" href="pages/scores.html"><i class="ti ti-clipboard-list"></i>Scores</a><a class="nav-item" data-page="results" href="pages/results.html"><i class="ti ti-chart-bar"></i>Results</a></div><div class="nav-section"><div class="nav-label">Reports</div><a class="nav-item" data-page="reports" href="pages/reports.html"><i class="ti ti-file-text"></i>Report Cards</a></div></div>
</nav>
<div class="main">
  <div class="topbar"><div class="topbar-left"><span class="page-title">Dashboard</span></div><div class="topbar-right"><span style="font-size:12px;color:var(--color-text-secondary)">Term 2, 2025</span><div class="avatar" style="width:32px;height:32px;font-size:12px">AD</div></div></div>
  <div class="content"><div class="stats-grid"><div class="stat-card"><div class="stat-icon"><i class="ti ti-users" style="color:#1D9E75"></i></div><div class="stat-label">Total Students</div><div class="stat-val" id="ds-students">0</div></div><div class="stat-card"><div class="stat-icon"><i class="ti ti-layers-subtract" style="color:#378ADD"></i></div><div class="stat-label">Class Streams</div><div class="stat-val" id="ds-streams">0</div></div><div class="stat-card"><div class="stat-icon"><i class="ti ti-book" style="color:#BA7517"></i></div><div class="stat-label">Subjects</div><div class="stat-val" id="ds-subjects">0</div></div><div class="stat-card"><div class="stat-icon"><i class="ti ti-clipboard-list" style="color:#D4537E"></i></div><div class="stat-label">Score Entries</div><div class="stat-val" id="ds-scores">0</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div class="card"><div class="section-hdr"><span class="section-title">Recent Students</span></div><div id="ds-recent-students"><div class="empty">No students yet</div></div></div><div class="card"><div class="section-hdr"><span class="section-title">Class Streams</span></div><div id="ds-streams-list"><div class="empty">No streams yet</div></div></div></div></div>
</div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>

</html>
