<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subjects - Ikonex Academy SMS</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="subjects">
<div class="layout">
<nav class="sidebar">
  <div class="sidebar-logo"><div class="logo-mark"><div class="logo-icon"><i class="ti ti-school"></i></div><div><div class="logo-text">Ikonex Academy</div><div class="logo-sub">School Management</div></div></div></div>
  <div class="nav"><div class="nav-section"><div class="nav-label">Overview</div><a class="nav-item" data-page="dashboard" href="../index.html"><i class="ti ti-layout-dashboard"></i>Dashboard</a></div><div class="nav-section"><div class="nav-label">Academic</div><a class="nav-item" data-page="streams" href="streams.html"><i class="ti ti-layers-subtract"></i>Class Streams</a><a class="nav-item" data-page="subjects" href="subjects.html"><i class="ti ti-book"></i>Subjects</a><a class="nav-item" data-page="students" href="students.html"><i class="ti ti-users"></i>Students</a></div><div class="nav-section"><div class="nav-label">Assessment</div><a class="nav-item" data-page="scores" href="scores.html"><i class="ti ti-clipboard-list"></i>Scores</a><a class="nav-item" data-page="results" href="results.html"><i class="ti ti-chart-bar"></i>Results</a></div><div class="nav-section"><div class="nav-label">Reports</div><a class="nav-item" data-page="reports" href="reports.html"><i class="ti ti-file-text"></i>Report Cards</a></div></div>
</nav>
<div class="main">
  <div class="topbar"><div class="topbar-left"><span class="page-title">Subjects</span></div><div class="topbar-right"><span style="font-size:12px;color:var(--color-text-secondary)">Term 2, 2025</span><div class="avatar" style="width:32px;height:32px;font-size:12px">AD</div></div></div>
  <div class="content"><div class="section-hdr"><div></div><button class="btn btn-primary" onclick="populateSubjectStreamCheckboxes();openModal('modal-subject')"><i class="ti ti-plus"></i>New Subject</button></div><div class="card"><div class="search-bar"><i class="ti ti-search search-icon"></i><input type="text" placeholder="Search subjects..." oninput="renderSubjects(this.value)"></div><table><thead><tr><th>Subject Name</th><th>Code</th><th>Assigned Streams</th><th>Actions</th></tr></thead><tbody id="subjects-table"><tr><td colspan="4" class="empty">No subjects yet</td></tr></tbody></table></div></div>
</div>
</div>
<div class="modal-overlay" id="modal-subject"><div class="modal"><div class="modal-hdr"><span class="modal-title" id="modal-subject-title">New Subject</span><button class="btn btn-sm" onclick="closeModal('modal-subject')"><i class="ti ti-x"></i></button></div><div class="modal-body"><input type="hidden" id="subject-edit-id"><div class="grid-2"><div class="form-group"><label class="form-label">Subject Name *</label><input type="text" id="subject-name" placeholder="e.g. Mathematics"></div><div class="form-group"><label class="form-label">Subject Code *</label><input type="text" id="subject-code" placeholder="e.g. MATH101"></div></div><div class="form-group"><label class="form-label">Assign to Streams</label><div id="subject-streams-checkboxes" style="display:flex;flex-wrap:wrap;gap:8px;padding:8px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md)"></div></div><div id="subject-form-alert"></div></div><div class="modal-footer"><button class="btn" onclick="closeModal('modal-subject')">Cancel</button><button class="btn btn-primary" onclick="saveSubject()">Save Subject</button></div></div></div>

<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
