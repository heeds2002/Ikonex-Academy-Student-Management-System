<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students - Ikonex Academy SMS</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="students">
<div class="layout">
<nav class="sidebar">
  <div class="sidebar-logo"><div class="logo-mark"><div class="logo-icon"><i class="ti ti-school"></i></div><div><div class="logo-text">Ikonex Academy</div><div class="logo-sub">School Management</div></div></div></div>
  <div class="nav"><div class="nav-section"><div class="nav-label">Overview</div><a class="nav-item" data-page="dashboard" href="../index.html"><i class="ti ti-layout-dashboard"></i>Dashboard</a></div><div class="nav-section"><div class="nav-label">Academic</div><a class="nav-item" data-page="streams" href="streams.html"><i class="ti ti-layers-subtract"></i>Class Streams</a><a class="nav-item" data-page="subjects" href="subjects.html"><i class="ti ti-book"></i>Subjects</a><a class="nav-item" data-page="students" href="students.html"><i class="ti ti-users"></i>Students</a></div><div class="nav-section"><div class="nav-label">Assessment</div><a class="nav-item" data-page="scores" href="scores.html"><i class="ti ti-clipboard-list"></i>Scores</a><a class="nav-item" data-page="results" href="results.html"><i class="ti ti-chart-bar"></i>Results</a></div><div class="nav-section"><div class="nav-label">Reports</div><a class="nav-item" data-page="reports" href="reports.html"><i class="ti ti-file-text"></i>Report Cards</a></div></div>
</nav>
<div class="main">
  <div class="topbar"><div class="topbar-left"><span class="page-title">Students</span></div><div class="topbar-right"><span style="font-size:12px;color:var(--color-text-secondary)">Term 2, 2025</span><div class="avatar" style="width:32px;height:32px;font-size:12px">AD</div></div></div>
  <div class="content"><div class="section-hdr"><div></div><button class="btn btn-primary" onclick="populateStudentStreamDropdowns();openModal('modal-student')"><i class="ti ti-plus"></i>Register Student</button></div><div class="card"><div style="display:flex;gap:10px;margin-bottom:12px"><div class="search-bar" style="flex:1;margin:0"><i class="ti ti-search search-icon"></i><input type="text" placeholder="Search students..." oninput="renderStudents(this.value,document.getElementById('filter-stream').value)" id="student-search"></div><select id="filter-stream" onchange="renderStudents(document.getElementById('student-search').value,this.value)" style="width:160px"><option value="">All Streams</option></select></div><table><thead><tr><th>Student</th><th>Adm No.</th><th>Stream</th><th>Gender</th><th>Actions</th></tr></thead><tbody id="students-table"><tr><td colspan="5" class="empty">No students yet</td></tr></tbody></table></div></div>
</div>
</div>
<div class="modal-overlay" id="modal-student"><div class="modal"><div class="modal-hdr"><span class="modal-title" id="modal-student-title">Register Student</span><button class="btn btn-sm" onclick="closeModal('modal-student')"><i class="ti ti-x"></i></button></div><div class="modal-body"><input type="hidden" id="student-edit-id"><div class="grid-2"><div class="form-group"><label class="form-label">First Name *</label><input type="text" id="student-fname" placeholder="First name"></div><div class="form-group"><label class="form-label">Last Name *</label><input type="text" id="student-lname" placeholder="Last name"></div></div><div class="grid-2"><div class="form-group"><label class="form-label">Admission No. *</label><input type="text" id="student-adm" placeholder="e.g. ADM2025001"></div><div class="form-group"><label class="form-label">Gender</label><select id="student-gender"><option>Male</option><option>Female</option><option>Other</option></select></div></div><div class="grid-2"><div class="form-group"><label class="form-label">Class Stream *</label><select id="student-stream"><option value="">Select stream...</option></select></div><div class="form-group"><label class="form-label">Date of Birth</label><input type="date" id="student-dob"></div></div><div class="form-group"><label class="form-label">Parent/Guardian Contact</label><input type="text" id="student-contact" placeholder="Phone or email"></div><div id="student-form-alert"></div></div><div class="modal-footer"><button class="btn" onclick="closeModal('modal-student')">Cancel</button><button class="btn btn-primary" onclick="saveStudent()">Save Student</button></div></div></div><div class="modal-overlay" id="modal-student-detail"><div class="modal" style="width:600px"><div class="modal-hdr"><span class="modal-title">Student Details</span><button class="btn btn-sm" onclick="closeModal('modal-student-detail')"><i class="ti ti-x"></i></button></div><div class="modal-body" id="student-detail-body"></div><div class="modal-footer"><button class="btn" onclick="closeModal('modal-student-detail')">Close</button></div></div></div>
<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
